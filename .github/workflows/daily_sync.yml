name: IDX-BEI Cloud Sync
on:
  schedule:
    # WIB (UTC+7) to UTC:
    # 12:15 WIB -> 05:15 UTC
    # 17:15 WIB -> 10:15 UTC
    # 22:15 WIB -> 15:15 UTC
    - cron: '15 5,10,15 * * 1-5'
  workflow_dispatch: # Allows you to run it manually with a button click

jobs:
  sync-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go Binary (Linux AMD64)
        run: |
          go build -ldflags="-s -w" -o bin/idx-sync-linux ./cmd/idx-sync

      - name: Run IDX Sync
        run: |
          ./bin/idx-sync-linux -data-dir ./data -delay 1.5 -retries 3

      - name: Install DuckDB CLI
        run: |
          wget -q https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip
          unzip -q duckdb_cli-linux-amd64.zip
          sudo mv duckdb /usr/local/bin/

      - name: Push to Supabase & Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests
          python scripts/parquet_to_supabase.py
