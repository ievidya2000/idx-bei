name: IDX-BEI Intraday YF Sync
on:
  schedule:
    # 12:15 WIB -> 05:15 UTC | 17:15 WIB -> 10:15 UTC
    - cron: '15 5,10 * * 1-5'
  workflow_dispatch:

jobs:
  yf-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas yfinance
      - name: Run YF Batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/yfinance_batch.py
